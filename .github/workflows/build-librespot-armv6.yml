# 라즈베리파이 1 / Zero 1세대(ARMv6)용 librespot(스포티파이 커넥트 재생 엔진) 빌드
#
# 사용법
#   1. GitHub에 새 저장소를 만들고, 이 파일을 .github/workflows/build-librespot-armv6.yml 경로로 올립니다.
#   2. 저장소의 Actions 탭 → "build-librespot-armv6" → "Run workflow"를 누릅니다.
#   3. 20~40분 뒤 완료되면 실행 결과 화면 맨 아래 Artifacts에서 librespot-armv6을 내려받습니다.
#
# 결과물은 외부 라이브러리 없이 동작하도록 TLS는 rustls, 소리 출력은 subprocess(aplay 연결) 방식으로 빌드합니다.

name: build-librespot-armv6

on:
  workflow_dispatch:
    inputs:
      version:
        description: "librespot 버전 (crates.io 기준)"
        default: "0.8.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: arm-unknown-linux-gnueabihf      # Rust의 ARMv6 + 하드웨어 부동소수점 타깃 (파이 1용)
      VER: ${{ inputs.version }}
    steps:
      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: cross 설치 (도커로 교차 컴파일하는 도구)
        run: cargo install cross --locked

      - name: librespot 소스 내려받기
        run: curl -sSfL "https://static.crates.io/crates/librespot/librespot-${VER}.crate" | tar xz

      - name: 빌드
        working-directory: librespot-${{ inputs.version }}
        run: |
          cross build --release --locked --target "$TARGET" \
            --no-default-features \
            --features "rustls-tls-webpki-roots with-libmdns"

      - name: ARMv6용인지 확인 (ARMv7로 빌드됐으면 실패 처리)
        run: |
          BIN="librespot-${VER}/target/${TARGET}/release/librespot"
          file "$BIN"
          readelf -A "$BIN" | grep -E "Tag_CPU_arch:|Tag_FP_arch:"
          readelf -A "$BIN" | grep -q "Tag_CPU_arch: v6" || { echo "ARMv6 바이너리가 아닙니다"; exit 1; }
          echo "필요한 라이브러리:"; readelf -d "$BIN" | grep NEEDED
          mkdir out && cp "$BIN" out/ && cp "librespot-${VER}/LICENSE" out/

      - name: 결과물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: librespot-armv6-${{ inputs.version }}
          path: out/
